[project]
name = "research-agent"
version = "0.1.0"
description = "AI-powered product research assistant that analyzes competitors, surfaces pain points, and identifies market gaps"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=0.3",
    "openai>=1.40",
    "httpx>=0.27",
    "tavily-python>=0.5",
    "google-play-scraper>=1.2",
    "python-dotenv>=1.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "tenacity>=9.0",
    "beautifulsoup4>=4.12",
    "readability-lxml>=0.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
